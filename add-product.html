<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Add Product — Vendorly</title>
  <link rel="icon" href="data:,">
  <link rel="icon" type="image/png" href="assets/images/vendorly-logo.png">
  <link rel="apple-touch-icon" href="assets/images/vendorly-logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/components/dashboard-shared.css">
  <link rel="stylesheet" href="assets/css/add-product.css">
</head>

<body>

  <div class="app-shell">

    <!-- HEADER -->
    <div class="page-header">
      <button class="back-btn" onclick="history.back()" aria-label="Go back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
      </button>
      <div class="page-header-text">
        <h1 class="page-title" id="pageTitle">Add Product</h1>
        <p class="page-subtitle" id="pageSubtitle">Fill in the details below</p>
      </div>
    </div>

    <!-- PAGE CONTENT -->
    <div class="page-content">

      <!-- Image Upload -->
      <div class="image-upload-section">
        <div class="image-upload-area" id="imageUploadArea">
          <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp">
          <img class="image-preview" id="imagePreview" src="" alt="" style="display:none">
          <div class="image-upload-placeholder" id="imagePlaceholder">
            <div class="upload-icon">📸</div>
            <p class="upload-text">Tap to upload product photo</p>
            <p class="upload-hint">JPG, PNG or WebP · Max 5MB</p>
          </div>
        </div>
        <button class="change-image-btn" id="changeImageBtn" style="display:none">
          Change Photo
        </button>
      </div>

      <!-- Product Form -->
      <div class="product-form-section">

        <div class="form-group">
          <label class="form-label" for="productName">Product Name <span class="required">*</span></label>
          <input class="form-input" id="productName" type="text" placeholder="e.g. Oversized Hoodie" maxlength="80">
          <p class="form-error" id="nameError">Product name is required</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="productPrice">Price (₦) <span class="required">*</span></label>
          <div class="price-input-wrap">
            <span class="price-prefix">₦</span>
            <input class="form-input price-input" id="productPrice" type="text" inputmode="numeric" placeholder="0"
              maxlength="10">
          </div>
          <p class="form-error" id="priceError">Enter a valid price</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="productDescription">Description <span class="optional">Optional</span></label>
          <textarea class="form-textarea" id="productDescription"
            placeholder="Describe your product — material, fit, what makes it special..." maxlength="500"></textarea>
          <p class="char-count" id="descCount">0 / 500</p>
        </div>

        <!-- Colors Tag Input -->
        <div class="form-group">
          <label class="form-label">Colors <span class="optional">Optional</span></label>
          <p class="form-hint">Type a color and press Enter or comma to add</p>
          <div class="tag-input-wrap" id="colorsWrap">
            <div class="tags-list" id="colorsList"></div>
            <input class="tag-input" id="colorsInput" type="text" placeholder="e.g. Red, Blue, Black">
          </div>
        </div>

        <!-- Sizes Tag Input -->
        <div class="form-group">
          <label class="form-label">Sizes <span class="optional">Optional</span></label>
          <p class="form-hint">Type a size and press Enter or comma to add</p>
          <div class="tag-input-wrap" id="sizesWrap">
            <div class="tags-list" id="sizesList"></div>
            <input class="tag-input" id="sizesInput" type="text" placeholder="e.g. S, M, L, XL or 40, 41, 42">
          </div>
        </div>

        <!-- Save Button -->
        <button class="btn-primary" id="saveProductBtn">
          Save Product
        </button>

        <!-- Delete button — only shows when editing -->
        <button class="btn-delete-product" id="deleteProductBtn" style="display:none">
          Delete Product
        </button>

      </div>

    </div>
    <!-- end page-content -->

  </div>
  <!-- end app-shell -->

  <script type="module" src="assets/js/add-product.js"></script>
</body>

</html>
