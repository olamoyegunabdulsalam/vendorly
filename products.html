<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Products | Vendorly</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/components/dashboard-shared.css">
  <link rel="stylesheet" href="assets/css/products.css">
</head>

<body>

  <div class="app-shell">

    <!-- HEADER -->
    <div class="dash-header">
      <div class="dash-header-left">
        <div class="dash-brand-block">
          <img class="dash-brand-logo" src="assets/images/vendorly-logo.png" alt="Vendorly logo">
          <div class="dash-brand-text">
            <span class="dash-brand-name">Vendorly</span>
            <span class="dash-brand-tagline">Build • Share • Sell</span>
          </div>
        </div>
      </div>
      <div class="dash-header-right">
        <a href="add-product.html" class="dash-notif-btn" aria-label="Add product">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add product
        </a>
        <div class="dash-avatar" id="vendorAvatar">?</div>
      </div>
    </div>


    <!-- PAGE CONTENT -->
    <div class="page-content">

      <!-- Search + Filter -->
      <div class="products-toolbar">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off">
          <button class="search-clear" id="searchClear" style="display:none">✕</button>
        </div>
      </div>
      <!-- Products Number  -->
      <p class="page-subtitle" id="productsSubtitle">Loading...</p>

      <!-- Products List -->
      <div id="productsList">
        <!-- Skeleton -->
        <div class="skeleton-list">
          <div class="skeleton-item"></div>
          <div class="skeleton-item"></div>
          <div class="skeleton-item"></div>
        </div>
      </div>

      <!-- Empty state — no products -->
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-state-icon">📦</div>
        <p class="empty-state-title">No products yet</p>
        <p class="empty-state-desc">Add your first product so customers can start ordering from your store</p>
        <a href="add-product.html" class="empty-state-btn">Add First Product</a>
      </div>

      <!-- Empty state — no search results -->
      <div class="empty-state" id="emptySearch" style="display:none">
        <div class="empty-state-icon">🔍</div>
        <p class="empty-state-title">No results found</p>
        <p class="empty-state-desc" id="emptySearchDesc"></p>
      </div>

    </div>
    <!-- end page-content -->

    <!-- DELETE CONFIRM MODAL -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal-sheet" style="border-radius: 20px 20px 0 0; padding-bottom: 32px">
        <div class="modal-handle"></div>
        <div class="modal-body" style="text-align:center; padding-top: 24px">
          <div style="font-size:40px; margin-bottom:12px">🗑️</div>
          <h3 style="font-size:17px; font-weight:700; margin-bottom:8px; color:var(--dark)">Delete Product?</h3>
          <p style="font-size:13px; color:var(--gray-500); margin-bottom:24px; line-height:1.5">
            This will permanently remove <strong id="deleteProductName"></strong> from your store. This cannot be
            undone.
          </p>
          <div style="display:flex; gap:10px">
            <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
            <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!-- end app-shell -->

  <script type="module" src="assets/js/products-page.js"></script>
</body>

</html>
